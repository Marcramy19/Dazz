<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Dazz Dezign Studio — Sign in</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #141414; color: #fff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 360px; background: #1c1c1c;
      border: 1px solid #2a2a2a; border-radius: 18px; padding: 34px 28px;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .brand { text-align: center; margin-bottom: 6px; font-weight: 800; letter-spacing: .5px; font-size: 20px; }
    .brand span { color: #e9ff2e; }
    .sub { text-align: center; color: #8a8a8a; font-size: 13px; margin-bottom: 26px; text-transform: uppercase; letter-spacing: 2px; }
    label { display: block; font-size: 12px; color: #9a9a9a; margin: 16px 0 6px; text-transform: uppercase; letter-spacing: 1px; }
    input {
      width: 100%; background: #141414; border: 1px solid #333; color: #fff;
      border-radius: 10px; padding: 13px 14px; font-size: 15px; outline: none;
    }
    input:focus { border-color: #e9ff2e; }
    button {
      width: 100%; margin-top: 24px; background: #e9ff2e; color: #141414;
      border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700;
      cursor: pointer; letter-spacing: .3px;
    }
    button:disabled { opacity: .6; cursor: default; }
    .err { margin-top: 16px; color: #ff6b6b; font-size: 13px; text-align: center; min-height: 16px; }
  </style>
</head>
<body>
  <form class="card" id="f" autocomplete="on">
    <div class="brand">Dazz <span>Dezign</span></div>
    <div class="sub">Studio Login</div>
    <label for="u">Username</label>
    <input id="u" name="username" type="text" autocomplete="username" autofocus required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Sign in</button>
    <div class="err" id="e"></div>
  </form>
  <script>
    var f = document.getElementById('f'), b = document.getElementById('b'), e = document.getElementById('e');
    f.addEventListener('submit', function (ev) {
      ev.preventDefault();
      e.textContent = ''; b.disabled = true; b.textContent = 'Signing in…';
      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ user: document.getElementById('u').value, pass: document.getElementById('p').value })
      }).then(function (r) {
        if (r.ok) { window.location.replace('/studio/'); return; }
        return r.json().catch(function () { return {}; }).then(function (j) {
          e.textContent = (j && j.error) || 'Invalid username or password';
          b.disabled = false; b.textContent = 'Sign in';
        });
      }).catch(function () {
        e.textContent = 'Network error. Please try again.';
        b.disabled = false; b.textContent = 'Sign in';
      });
    });
  </script>
</body>
</html>
