<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Dazz Dezign — Cap Designer</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{background:#f4f4f2;color:#141414;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#141414;color:#fff;}
  .brand{font-weight:800;letter-spacing:.3px;}.brand span{color:#e9ff2e;}
  .top a{color:#cfcfcf;text-decoration:none;font-size:13px;font-weight:600;margin-left:16px;}
  .wrap{max-width:1080px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 360px;gap:22px;}
  @media(max-width:820px){.wrap{grid-template-columns:1fr;}}
  .card{background:#fff;border:1px solid #e7e7e3;border-radius:18px;padding:16px;}
  .stage{position:relative;width:100%;aspect-ratio:1;background:#fafafa;border-radius:14px;overflow:hidden;}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;}
  #cv.drag{cursor:grabbing;}
  .hint{text-align:center;color:#9a9a96;font-size:12px;margin-top:10px;letter-spacing:.4px;}
  h2{font-size:11px;letter-spacing:2px;color:#9a9a96;text-transform:uppercase;margin:18px 0 9px;font-weight:700;}
  h2:first-child{margin-top:4px;}
  .swatches{display:flex;flex-wrap:wrap;gap:9px;}
  .sw{width:34px;height:34px;border-radius:50%;border:2px solid #e0e0db;cursor:pointer;}
  .sw.on{outline:2px solid #141414;outline-offset:2px;}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:96px;border:2px dashed #d8d7d2;border-radius:14px;background:#fafafa;cursor:pointer;text-align:center;color:#6f6f6c;font-weight:700;font-size:13px;}
  .drop.over{border-color:#141414;background:#f0f0ec;}
  .drop small{color:#b3b3ae;font-weight:500;font-size:11px;}
  .row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#6f6f6c;margin:14px 0 6px;font-weight:600;}
  input[type=range]{width:100%;accent-color:#141414;}
  .btns{display:flex;gap:8px;margin-top:10px;}
  .btn{flex:1;padding:10px;border-radius:10px;border:1px solid #e0e0db;background:#fff;font-weight:700;font-size:13px;cursor:pointer;}
  .btn.ghost{color:#c0392b;border-color:#f0d6d2;}
  .field{margin-top:10px;}
  .field label{display:block;font-size:11px;letter-spacing:1px;color:#9a9a96;text-transform:uppercase;margin-bottom:5px;font-weight:700;}
  .field input,.field select{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:10px;font-size:14px;background:#fff;}
  .save{width:100%;margin-top:16px;background:#141414;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;}
  .save:disabled{opacity:.55;cursor:default;}
  .msg{margin-top:12px;font-size:13px;text-align:center;min-height:18px;font-weight:600;}
  .msg.ok{color:#1e7a3d;}.msg.err{color:#c0392b;}
</style>
</head>
<body>
<div class="top">
  <div class="brand">Dazz <span>Dezign</span> · Cap Designer</div>
  <div><a href="/studio/">← Dashboard</a><a href="#" id="signout">Sign out</a></div>
</div>
<div class="wrap">
  <div class="card">
    <div class="stage"><canvas id="cv" width="760" height="760"></canvas></div>
    <div class="hint">Drag the artwork to move · drag the corner to resize · drag the top dot to rotate</div>
  </div>
  <div class="card">
    <h2>Cap colour</h2>
    <div class="swatches" id="sw"></div>

    <h2>Artwork</h2>
    <label class="drop" id="drop">
      <span>Drop logo / artwork</span>
      <small>PNG with transparent background works best</small>
      <input type="file" id="file" accept="image/*" hidden>
    </label>
    <div class="row"><span>Size</span><span id="sizeVal">100%</span></div>
    <input type="range" id="size" min="0.15" max="3" step="0.01" value="1">
    <div class="row"><span>Rotate</span><span id="rotVal">0°</span></div>
    <input type="range" id="rot" min="-180" max="180" step="1" value="0">
    <div class="btns">
      <button class="btn" id="reset">Reset position</button>
      <button class="btn ghost" id="remove">Remove artwork</button>
    </div>

    <h2>Send to catalog</h2>
    <div class="field"><label>Product name</label><input id="pname" placeholder="e.g. No Bad Vibes"></div>
    <div class="field"><label>Type</label><select id="ptype"><option>trucker cap</option><option>classic cap</option><option>beach tote</option><option>tote bag</option></select></div>
    <div class="field"><label>Price (EGP)</label><input id="pprice" type="number" inputmode="numeric" placeholder="650"></div>
    <button class="save" id="save">Save to catalog</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

  const c = off.getContext('2d'); c.drawImage(capImg,0,0);
  const d = c.getImageData(0,0,off.width,off.height); const a=d.data;
  const tr=parseInt(hex.slice(1,3),16), tg=parseInt(hex.slice(3,5),16), tb=parseInt(hex.slice(5,7),16);
  for(let i=0;i<a.length;i+=4){
    const lum = 0.299*a[i]+0.587*a[i+1]+0.114*a[i+2];
    if(lum>236) continue; // background / bright highlights stay
    const f = Math.min(1.25, lum/170);
    a[i]=Math.min(255,tr*f); a[i+1]=Math.min(255,tg*f); a[i+2]=Math.min(255,tb*f);
  }
  c.putImageData(d,0,0);
  capTinted[hex]=off; return off;
}

// ---- artwork geometry ----
function artBox(){ // natural draw size of art (before scale), fit within 300px box
  const im = state.art.img; const max=300; const r=Math.min(max/im.naturalWidth, max/im.naturalHeight);
  return { w: im.naturalWidth*r, h: im.naturalHeight*r };
}
function corners(){ // 4 corners + top handle, in canvas coords
  const a=state.art, b=artBox(); const hw=b.w*a.scale/2, hh=b.h*a.scale/2;
  const cos=Math.cos(a.rot), sin=Math.sin(a.rot);
  const tf=(x,y)=>({x:a.cx+x*cos-y*sin, y:a.cy+x*sin+y*cos});
  return { tl:tf(-hw,-hh), tr:tf(hw,-hh), br:tf(hw,hh), bl:tf(-hw,hh), rotH:tf(0,-hh-46), c:{x:a.cx,y:a.cy}, hw, hh, cos, sin };
}

function draw(forExport){
  ctx.clearRect(0,0,S,S);
  // cap, fit (contain) centered
  const cap = tintCap(state.color); const iw=cap.width, ih=cap.height;
  const r=Math.min(S/iw, S/ih)*0.98; const w=iw*r, h=ih*r;
  ctx.drawImage(cap, (S-w)/2, (S-h)/2, w, h);
  // artwork
  if(state.art){
    const a=state.art, b=artBox();
    ctx.save(); ctx.translate(a.cx,a.cy); ctx.rotate(a.rot); ctx.scale(a.scale,a.scale);
    ctx.drawImage(a.img, -b.w/2, -b.h/2, b.w, b.h); ctx.restore();
    if(state.sel && !forExport){
      const k=corners();
      ctx.save(); ctx.strokeStyle='#141414'; ctx.lineWidth=2; ctx.setLineDash([7,5]);
      ctx.beginPath(); ctx.moveTo(k.tl.x,k.tl.y); ctx.lineTo(k.tr.x,k.tr.y); ctx.lineTo(k.br.x,k.br.y); ctx.lineTo(k.bl.x,k.bl.y); ctx.closePath(); ctx.stroke();
      ctx.setLineDash([]);
      // rotate handle line + dot
      const topMid={x:(k.tl.x+k.tr.x)/2,y:(k.tl.y+k.tr.y)/2};
      ctx.beginPath(); ctx.moveTo(topMid.x,topMid.y); ctx.lineTo(k.rotH.x,k.rotH.y); ctx.stroke();
      dot(k.rotH,'#141414'); dot(k.br,'#fff','#141414');
      ctx.restore();
    }
  }
}
function dot(p,fill,stroke){ ctx.beginPath(); ctx.arc(p.x,p.y,11,0,7); ctx.fillStyle=fill||'#141414'; ctx.fill(); if(stroke){ctx.lineWidth=3;ctx.strokeStyle=stroke;ctx.stroke();} }

// ---- pointer -> canvas coords ----
function xy(e){ const r=cv.getBoundingClientRect(); return { x:(e.clientX-r.left)*(S/r.width), y:(e.clientY-r.top)*(S/r.height) }; }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function inBody(p){ const a=state.art,b=artBox(); const dx=p.x-a.cx,dy=p.y-a.cy; const cos=Math.cos(-a.rot),sin=Math.sin(-a.rot);
  const lx=dx*cos-dy*sin, ly=dx*sin+dy*cos; return Math.abs(lx)<=b.w*a.scale/2 && Math.abs(ly)<=b.h*a.scale/2; }

let drag=null;
cv.addEventListener('pointerdown', e=>{
  if(!state.art) return;
  const p=xy(e); const k=corners();
  let mode=null;
  if(state.sel && dist(p,k.rotH)<26) mode='rotate';
  else if(state.sel && dist(p,k.br)<26) mode='scale';
  else if(inBody(p)) mode='move';
  if(!mode){ state.sel=false; draw(); return; }
  state.sel=true; cv.classList.add('drag');
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const a=state.art;
  drag={ mode, startP:p, startCx:a.cx, startCy:a.cy, startScale:a.scale, startRot:a.rot,
         startDist:dist(p,k.c), startAng:Math.atan2(p.y-a.cy,p.x-a.cx), offx:p.x-a.cx, offy:p.y-a.cy };
  draw();
  e.preventDefault();
});
cv.addEventListener('pointermove', e=>{
  if(!drag) return; const p=xy(e); const a=state.art;
  if(drag.mode==='move'){ a.cx=p.x-drag.offx; a.cy=p.y-drag.offy; }
  else if(drag.mode==='scale'){ const d=dist(p,{x:a.cx,y:a.cy}); a.scale=Math.max(0.15,Math.min(3, drag.startScale*(d/(drag.startDist||1)))); syncSliders(); }
  else if(drag.mode==='rotate'){ const ang=Math.atan2(p.y-a.cy,p.x-a.cx); a.rot=drag.startRot+(ang-drag.startAng); syncSliders(); }
  draw(); e.preventDefault();
});
function endDrag(e){ if(drag){ drag=null; cv.classList.remove('drag'); try{cv.releasePointerCapture(e.pointerId);}catch(_){} } }
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// ---- controls ----
const sizeEl=document.getElementById('size'), rotEl=document.getElementById('rot');
function syncSliders(){ if(!state.art) return; sizeEl.value=state.art.scale; document.getElementById('sizeVal').textContent=Math.round(state.art.scale*100)+'%';
  let deg=Math.round(state.art.rot*180/Math.PI); deg=((deg+180)%360+360)%360-180; rotEl.value=deg; document.getElementById('rotVal').textContent=deg+'°'; }
sizeEl.addEventListener('input', ()=>{ if(!state.art)return; state.art.scale=parseFloat(sizeEl.value); document.getElementById('sizeVal').textContent=Math.round(state.art.scale*100)+'%'; state.sel=true; draw(); });
rotEl.addEventListener('input', ()=>{ if(!state.art)return; state.art.rot=parseFloat(rotEl.value)*Math.PI/180; document.getElementById('rotVal').textContent=rotEl.value+'°'; state.sel=true; draw(); });
document.getElementById('reset').onclick=()=>{ if(!state.art)return; state.art.cx=S/2; state.art.cy=S*0.40; state.art.scale=1; state.art.rot=0; syncSliders(); state.sel=true; draw(); };
document.getElementById('remove').onclick=()=>{ state.art=null; state.sel=false; draw(); };

// swatches
const swWrap=document.getElementById('sw');
COLOURS.forEach((c,i)=>{ const d=document.createElement('div'); d.className='sw'+(i===0?' on':''); d.style.background=c.hex; d.title=c.name;
  d.onclick=()=>{ state.color=c.hex; [...swWrap.children].forEach(x=>x.classList.remove('on')); d.classList.add('on'); draw(); }; swWrap.appendChild(d); });

// upload
function loadArt(file){ if(!file||!/^image\//.test(file.type))return; const fr=new FileReader();
  fr.onload=()=>{ const im=new Image(); im.onload=()=>{ state.art={img:im,cx:S/2,cy:S*0.40,scale:1,rot:0}; state.sel=true; syncSliders(); draw(); }; im.src=fr.result; }; fr.readAsDataURL(file); }
const fileEl=document.getElementById('file'), dropEl=document.getElementById('drop');
dropEl.onclick=()=>fileEl.click();
fileEl.onchange=e=>loadArt(e.target.files&&e.target.files[0]);
['dragover','dragenter'].forEach(ev=>dropEl.addEventListener(ev,e=>{e.preventDefault();dropEl.classList.add('over');}));
['dragleave','drop'].forEach(ev=>dropEl.addEventListener(ev,e=>{e.preventDefault();dropEl.classList.remove('over');}));
dropEl.addEventListener('drop',e=>loadArt(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]));
cv.addEventListener('dragover',e=>e.preventDefault());
cv.addEventListener('drop',e=>{e.preventDefault();loadArt(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]);});

// save to catalog
const msg=document.getElementById('msg'), saveBtn=document.getElementById('save');
saveBtn.onclick=async ()=>{
  const name=document.getElementById('pname').value.trim();
  const price=parseInt(document.getElementById('pprice').value,10);
  const type=document.getElementById('ptype').value;
  if(!state.art){ return show('Add some artwork first.', false); }
  if(!name){ return show('Give the product a name.', false); }
  if(!price||price<=0){ return show('Enter a valid price.', false); }
  saveBtn.disabled=true; show('Saving…');
  const prev=state.sel; state.sel=false; draw(true);
  const img=cv.toDataURL('image/jpeg',0.9);
  state.sel=prev; draw();
  try{
    const cur=await (await fetch('/api/products',{credentials:'same-origin'})).json();
    const list=Array.isArray(cur)?cur:[];
    list.push({ id:'p-'+Date.now(), name, type, img, tone:state.color, price, active:true });
    const r=await fetch('/api/state',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'dazz.products.v2',value:list})});
    if(r.status===401){ show('Session expired — please sign in again.', false); setTimeout(()=>location.href='/login',1200); return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    show('✓ Saved! It is now live on the website.', true);
    document.getElementById('pname').value=''; document.getElementById('pprice').value='';
  }catch(e){ show('Could not save: '+e.message, false); }
  saveBtn.disabled=false;
};
function show(t,ok){ msg.textContent=t; msg.className='msg'+(ok===true?' ok':ok===false?' err':''); }
document.getElementById('signout').onclick=e=>{ e.preventDefault(); fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'}).finally(()=>location.href='/login'); };

capImg.onload=()=>{ draw(); };
capImg.onerror=()=>{ show('Cap image failed to load.', false); };
capImg.src=CAP_SRC;
</script>
</body>
</html>
